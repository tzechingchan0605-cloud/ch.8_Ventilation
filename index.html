<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>換氣實驗室 · Ventilation Lab</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><span class="eyebrow" data-t="chapter"></span><h1 data-t="title"></h1></div><div class="language" role="group" aria-label="繁體中文 | English"><button id="zh">繁體中文</button><button id="en">English</button></div></header>
<main><div class="intro"><div><span class="eyebrow" data-t="chapter"></span><h2 data-t="headline"></h2><p data-t="intro"></p></div><span class="badge" data-t="schematic"></span></div>
<nav id="modes"><button data-mode="explore" data-t="explore"></button><button data-mode="challenge" data-t="challenge"></button></nav>
<section class="lab"><div class="model-panel"><div class="toolbar"><div id="views"><button data-view="body" data-t="body"></button><button data-view="sac" data-t="sac"></button><button data-view="jar" data-t="jar"></button></div><button id="labels" data-t="labels"></button></div><div id="drawing"></div><p id="caption" class="caption" aria-live="polite"></p></div>
<aside><span class="eyebrow" data-t="controls"></span><h3 id="phaseTitle"></h3><div id="playback"><button id="play" class="primary"></button><button id="step" data-t="step"></button><button id="reset" data-t="reset"></button><button id="replay" data-t="replay"></button></div><label for="phase" data-t="cycle"></label><input id="phase" type="range" min="0" max="1000" value="0"><div class="two"><button id="inhale" data-t="inhale"></button><button id="exhale" data-t="exhale"></button></div><label for="speed" data-t="speed"></label><select id="speed"><option value="1" data-t="normal"></option><option value="0.25" data-t="slow"></option></select><p class="small" data-t="speedHelp"></p><div class="readings" id="readings"></div><button id="record" data-t="record"></button><p class="small" data-t="residual"></p></aside></section>
<section class="evidence"><div><h3 data-t="evidence"></h3><div id="charts"></div></div><div><div class="toolbar"><h3 data-t="trials"></h3><button id="download" data-t="download"></button></div><p class="small" data-t="snapshot"></p><div class="table-wrap"><table><thead id="tableHead"></thead><tbody id="records"></tbody></table></div><button id="clear" data-t="clear"></button></div></section>
<section id="challengePanel" hidden><span class="eyebrow" data-t="challenge"></span><h2 data-t="challengeTitle"></h2><label for="task" data-t="task"></label><select id="task"></select><h3 id="question"></h3><p data-t="predictHelp"></p><div id="answers"></div><label for="explanation" data-t="explain"></label><textarea id="explanation" rows="3"></textarea><div class="toolbar"><button id="check" class="primary" data-t="check"></button><button id="hint" data-t="hint"></button><button id="reveal" data-t="reveal"></button></div><p id="hintText"></p><p id="feedback" aria-live="polite"></p></section>
<details><summary data-t="modelInfo"></summary><p data-t="assumptions"></p><p data-t="scope"></p><p data-t="source"></p><div id="glossary"></div></details><footer data-t="footer"></footer></main><script type="module" src="app.js"></script></body></html>
